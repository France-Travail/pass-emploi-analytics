version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
      time: '07:00'
      timezone: Europe/Paris
    commit-message:
      prefix: 'chore(deps):'
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      pip-minor-patch:
        applies-to: version-updates
        update-types:
          - patch
          - minor
      pip-major:
        applies-to: version-updates
        update-types:
          - major
